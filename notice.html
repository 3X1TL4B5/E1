<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF0F6">
<title>공지사항</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<main class="page">
  <div id="list-view" class="stack">
    <div class="page-head"><div><h1>공지사항</h1><p class="hint" style="margin-top:4px">운영 소식과 안내</p></div></div>
    <section class="tile"><div class="list" id="items"><div class="skel"></div></div></section>
  </div>

  <div id="write-view" class="stack hidden">
    <div class="page-head"><div><p>공지사항</p><h1 id="w-head">공지 쓰기</h1></div></div>
    <section class="tile">
      <form id="form">
        <input id="w-title" placeholder="제목" maxlength="100" required>
        <textarea id="w-content" placeholder="내용" maxlength="5000" required></textarea>
        <label class="chk"><input type="checkbox" id="w-pin"> 목록 맨 위에 고정</label>
        <div class="row">
          <button class="ghost" type="button" id="w-cancel">취소</button>
          <button class="primary" id="w-btn" type="submit">저장</button>
        </div>
      </form>
      <p id="w-msg" class="msg" role="alert"></p>
    </section>
  </div>

  <div id="detail-view" class="stack hidden">
    <div><button class="ghost" id="back" type="button">← 목록</button></div>
    <section class="tile detail">
      <h2 id="d-title"></h2>
      <div class="m" id="d-meta"></div>
      <div class="body" id="d-body"></div>
      <div class="row hidden" id="d-admin">
        <button class="ghost" id="d-edit" type="button">수정</button>
        <button class="ghost danger" id="d-del" type="button">삭제</button>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="nav.js"></script>
<script>
  const sb = GH.sb();
  const $ = (id) => document.getElementById(id);
  let me = null, isAdmin = false, current = null, editingId = null;
  const fmt = (s) => new Date(s).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" });
  const show = (n) => ["list", "write", "detail"].forEach(v => $(v + "-view").classList.toggle("hidden", v !== n));

  async function loadList() {
    history.replaceState(null, "", "notice.html");
    show("list");
    const box = $("items"); box.replaceChildren();
    const { data, error } = await sb.from("notices").select("id,title,pinned,created_at").order("pinned", { ascending: false }).order("created_at", { ascending: false }).limit(50);
    const note = (t) => { const d = document.createElement("div"); d.className = "empty"; d.textContent = t; box.appendChild(d); };
    if (error) return note("불러오지 못했어요: " + error.message);
    if (!data.length) return note("등록된 공지가 없어요.");
    data.forEach(n => {
      const b = document.createElement("button"); b.className = "list-item"; b.type = "button";
      const t = document.createElement("div"); t.className = "t";
      if (n.pinned) { const p = document.createElement("span"); p.className = "pin"; p.textContent = "고정"; t.appendChild(p); }
      t.append(n.title);
      const m = document.createElement("div"); m.className = "m"; m.textContent = fmt(n.created_at);
      b.append(t, m); b.onclick = () => openNotice(n.id); box.appendChild(b);
    });
  }

  async function openNotice(id) {
    const { data, error } = await sb.from("notices").select("id,title,content,pinned,created_at,updated_at").eq("id", id).single();
    if (error) { alert("공지를 불러오지 못했어요."); return loadList(); }
    current = data;
    history.replaceState(null, "", "notice.html?id=" + id);
    $("d-title").textContent = data.title;
    $("d-meta").textContent = fmt(data.created_at) + (data.updated_at && data.updated_at.slice(0, 10) !== data.created_at.slice(0, 10) ? " (수정 " + fmt(data.updated_at) + ")" : "");
    $("d-body").textContent = data.content;
    $("d-admin").classList.toggle("hidden", !isAdmin);
    show("detail"); window.scrollTo(0, 0);
  }

  function openForm(n) {
    editingId = n ? n.id : null;
    $("w-head").textContent = n ? "공지 수정" : "공지 쓰기";
    $("w-title").value = n ? n.title : ""; $("w-content").value = n ? n.content : ""; $("w-pin").checked = n ? n.pinned : false;
    $("w-msg").textContent = ""; show("write"); window.scrollTo(0, 0);
  }

  $("w-cancel").onclick = () => (editingId && current ? openNotice(current.id) : loadList());
  $("back").onclick = loadList;
  $("d-edit").onclick = () => openForm(current);
  $("d-del").onclick = async () => {
    if (!confirm("이 공지를 삭제할까요?")) return;
    const { error } = await sb.from("notices").delete().eq("id", current.id);
    if (error) return alert("삭제하지 못했어요: " + error.message);
    loadList();
  };

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const row = { title: $("w-title").value.trim(), content: $("w-content").value.trim(), pinned: $("w-pin").checked };
    if (!row.title || !row.content) { $("w-msg").textContent = "제목과 내용을 입력해 주세요."; return; }
    $("w-btn").disabled = true;
    const r = editingId
      ? await sb.from("notices").update({ ...row, updated_at: new Date().toISOString() }).eq("id", editingId)
      : await sb.from("notices").insert(row);
    $("w-btn").disabled = false;
    if (r.error) { $("w-msg").textContent = "저장하지 못했어요: " + r.error.message; return; }
    loadList();
  });

  (async () => {
    const { data } = await sb.auth.getSession();
    if (!data.session) return location.replace("index.html");
    me = data.session.user;
    const p = await sb.from("profiles").select("nickname").eq("id", me.id).maybeSingle();
    if (!p.data) return location.replace("main.html");          // 닉네임부터 정하기
    const a = await sb.from("admins").select("user_id").eq("user_id", me.id).maybeSingle();
    isAdmin = !!a.data;
    // 관리자는 상단 버튼이 '공지 쓰기', 회원은 기본 글쓰기(자유게시판)
    E1Nav.init(sb, { active: "notice", isAdmin, write: isAdmin ? { label: "공지 쓰기", onClick: () => openForm(null) } : {} });
    const id = new URLSearchParams(location.search).get("id");
    if (id && /^\d+$/.test(id)) openNotice(id); else loadList();
  })();
</script>
</body>
</html>
