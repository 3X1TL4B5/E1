<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF0F6">
<title>관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  /* 관리 목록 줄: 이름·설명 + 오른쪽 버튼들 */
  .item { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-top: 1px solid var(--line); }
  #panel > .item:first-of-type { border-top: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .t { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .item .s { font-size: 12px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  .item .btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; flex: none; max-width: 58%; }
  .item .btns .ghost { padding: 7px 11px; font-size: 13px; }
  .tag { color: var(--danger); font-weight: 600; font-size: 12px; }
  #panel { gap: 12px; }
  #panel form { display: flex; gap: 8px; }
  #panel form input { flex: 1; min-width: 0; }
  .add { flex: none; padding: 0 18px; color: var(--on-accent); background: var(--accent); border: 0; border-radius: var(--r-ctl); font: 700 15px var(--f-body); cursor: pointer; }
  .add:hover { background: var(--accent-hover); }
  @media (max-width: 520px) { .item { flex-wrap: wrap; } .item .btns { max-width: 100%; justify-content: flex-start; } }
</style>
</head>
<body>
<main class="page">
  <div class="page-head">
    <div><p>운영</p><h1>관리</h1></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
      <button class="ghost" type="button" id="backup-btn">백업 받기</button>
      <span class="hint" id="backup-msg"></span>
    </div>
  </div>
  <div class="tabs">
    <button class="ghost on" data-tab="members" type="button">회원</button>
    <button class="ghost" data-tab="invites" type="button">초대</button>
    <button class="ghost" data-tab="boards" type="button">게시판</button>
    <button class="ghost" data-tab="reserved" type="button">금지어</button>
  </div>
  <section class="tile" id="panel"><div class="empty">불러오는 중...</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="nav.js"></script>
<script>
  const sb = GH.sb();
  const $ = (id) => document.getElementById(id);
  const panel = $("panel");
  let me = null;

  function empty(text) { const d = document.createElement("div"); d.className = "empty"; d.textContent = text; panel.replaceChildren(d); }
  function item(title, sub, tag, buttons) {
    const row = document.createElement("div"); row.className = "item";
    const info = document.createElement("div"); info.className = "info";
    const t = document.createElement("div"); t.className = "t"; t.textContent = title;
    if (tag) { const g = document.createElement("span"); g.className = "tag"; g.textContent = " " + tag; t.appendChild(g); }
    info.appendChild(t);
    if (sub) { const s = document.createElement("div"); s.className = "s"; s.textContent = sub; info.appendChild(s); }
    const b = document.createElement("div"); b.className = "btns";
    buttons.forEach(x => { const el = document.createElement("button"); el.className = "ghost" + (x.danger ? " danger" : ""); el.textContent = x.label; el.onclick = x.fn; b.appendChild(el); });
    row.append(info, b); return row;
  }
  const NICK = /^[가-힣A-Za-z0-9_]{2,12}$/;

  /* 회원 */
  async function loadMembers() {
    const { data, error } = await sb.rpc("admin_members");
    if (error) return empty("불러오지 못했어요: " + error.message);
    if (!data.length) return empty("회원이 없어요.");
    panel.replaceChildren();
    data.forEach(m => {
      const btns = [{ label: "닉네임", fn: async () => {
        const n = (prompt("새 닉네임 (2~12자)", m.nickname) || "").trim();
        if (!n || n === m.nickname) return;
        if (!NICK.test(n)) return alert("한글·영문·숫자·_ 로 2~12자만 쓸 수 있어요.");
        const { error } = await sb.from("profiles").update({ nickname: n }).eq("id", m.id);
        if (error) return alert(error.code === "23505" ? "이미 사용 중인 닉네임이에요." : error.message);
        loadMembers();
      } }];
      if (m.id !== me.id) btns.push({ label: m.banned ? "차단 해제" : "차단", danger: !m.banned, fn: async () => {
        if (!m.banned && !confirm(m.nickname + " 님을 차단할까요? 글·채팅을 쓸 수 없게 돼요.")) return;
        const r = m.banned ? await sb.from("banned_users").delete().eq("user_id", m.id) : await sb.from("banned_users").insert({ user_id: m.id });
        if (r.error) return alert(r.error.message);
        loadMembers();
      } });
      panel.appendChild(item(m.nickname, m.email, m.banned ? "차단됨" : "", btns));
    });
  }

  /* 초대 링크 */
  function inviteUrl(code) { const u = new URL("signup.html", location.href); u.search = "?code=" + code; return u.href; }
  function copyInvite(code) {
    const url = inviteUrl(code);
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => alert("링크를 복사했어요.")).catch(() => prompt("복사해서 전달하세요", url));
  }
  async function loadInvites() {
    const { data, error } = await sb.from("invite_links").select("id,code,label,max_uses,used_count,expires_at,active").order("id", { ascending: false });
    if (error) return empty("불러오지 못했어요: " + error.message);
    panel.replaceChildren();
    const hint = document.createElement("p"); hint.className = "hint";
    hint.textContent = "인원과 기간을 비우면 제한이 없어요. 무제한 링크가 퍼지면 아무나 들어올 수 있으니, 이상하면 바로 끄세요.";
    const f = document.createElement("form"); f.style.flexDirection = "column";
    const mk = (ph, type) => { const i = document.createElement("input"); i.placeholder = ph; if (type) { i.type = type; i.min = 1; i.inputMode = "numeric"; } return i; };
    const label = mk("이름 (예: 10월 이벤트)"), max = mk("최대 인원 (비우면 무제한)", "number"), days = mk("유효 기간 일 수 (비우면 무기한)", "number");
    label.maxLength = 30;
    const a = document.createElement("button"); a.className = "add"; a.style.padding = "12px"; a.textContent = "링크 만들기";
    f.append(label, max, days, a);
    f.onsubmit = async (e) => {
      e.preventDefault();
      const m = max.value ? parseInt(max.value, 10) : null, d = days.value ? parseInt(days.value, 10) : null;
      if (!m && !d && !confirm("인원과 기간이 모두 무제한이에요. 링크가 퍼지면 아무나 가입할 수 있어요. 그래도 만들까요?")) return;
      const row = { label: label.value.trim() || null, max_uses: m, expires_at: d ? new Date(Date.now() + d * 86400000).toISOString() : null };
      const r = await sb.from("invite_links").insert(row).select("code").single();
      if (r.error) return alert(r.error.message);
      copyInvite(r.data.code); loadInvites();
    };
    panel.append(hint, f);
    if (!data.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = "만든 링크가 없어요."; panel.appendChild(d); return; }
    const now = Date.now();
    data.forEach(l => {
      const expired = l.expires_at && new Date(l.expires_at) < now, full = l.max_uses && l.used_count >= l.max_uses;
      const status = !l.active ? "꺼짐" : expired ? "만료" : full ? "마감" : "";
      const sub = l.used_count + "/" + (l.max_uses || "∞") + "명 · " + (l.expires_at ? new Date(l.expires_at).toLocaleDateString("ko-KR") + "까지" : "기간 제한 없음");
      panel.appendChild(item(l.label || "이름 없음", sub, status, [
        { label: "복사", fn: () => copyInvite(l.code) },
        { label: l.active ? "끄기" : "켜기", danger: l.active, fn: async () => { const { error } = await sb.from("invite_links").update({ active: !l.active }).eq("id", l.id); if (error) return alert(error.message); loadInvites(); } },
        { label: "삭제", danger: true, fn: async () => { if (!confirm("이 링크를 삭제할까요? 이미 가입한 회원에게는 영향이 없어요.")) return; const { error } = await sb.from("invite_links").delete().eq("id", l.id); if (error) return alert(error.message); loadInvites(); } }
      ]));
    });
  }

  /* 게시판 (상위 → 하위) */
  async function loadBoardsAdmin() {
    const { data, error } = await sb.from("boards").select("id,parent_id,name,position").order("position").order("id");
    if (error) return empty("불러오지 못했어요: " + error.message);
    panel.replaceChildren();
    const groups = data.filter(b => !b.parent_id), kids = (id) => data.filter(b => b.parent_id === id);
    const maxPos = (list) => list.reduce((m, b) => Math.max(m, b.position), -1);
    const dupe = (r) => r.error && (r.error.code === "23505" ? alert("같은 이름이 이미 있어요.") : alert(r.error.message));

    const hint = document.createElement("p"); hint.className = "hint";
    hint.textContent = "상위 게시판 아래에 하위 게시판을 만들어요. 회원은 하위 게시판에 글을 써요. 삭제해도 글은 남고, 전체 글에서만 보여요.";
    const f = document.createElement("form");
    const i = document.createElement("input"); i.placeholder = "새 상위 게시판 이름"; i.maxLength = 20;
    const a = document.createElement("button"); a.className = "add"; a.textContent = "추가";
    f.append(i, a);
    f.onsubmit = async (e) => {
      e.preventDefault();
      const name = i.value.trim(); if (!name) return;
      const r = await sb.from("boards").insert({ name, parent_id: null, position: maxPos(groups) + 1 });
      if (r.error) return dupe(r);
      loadBoardsAdmin();
    };
    panel.append(hint, f);
    if (!groups.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = "아직 게시판이 없어요."; panel.appendChild(d); return; }

    const rename = async (b) => {
      const n = (prompt("새 이름 (1~20자)", b.name) || "").trim();
      if (!n || n === b.name) return;
      if (n.length > 20) return alert("20자까지만 쓸 수 있어요.");
      const r = await sb.from("boards").update({ name: n }).eq("id", b.id);
      if (r.error) return dupe(r);
      loadBoardsAdmin();
    };
    const move = async (list, idx, dir) => {
      const j = idx + dir; if (j < 0 || j >= list.length) return;
      const arr = list.slice(); [arr[idx], arr[j]] = [arr[j], arr[idx]];
      await Promise.all(arr.map((b, n) => b.position !== n ? sb.from("boards").update({ position: n }).eq("id", b.id) : null).filter(Boolean));
      loadBoardsAdmin();
    };
    const remove = async (b, isGroup) => {
      const msg = isGroup ? "'" + b.name + "' 상위 게시판과 그 아래 하위 게시판을 모두 삭제할까요? 글은 남아요." : "'" + b.name + "' 하위 게시판을 삭제할까요? 글은 남아요.";
      if (!confirm(msg)) return;
      const r = await sb.from("boards").delete().eq("id", b.id);
      if (r.error) return alert(r.error.message);
      loadBoardsAdmin();
    };

    groups.forEach((g, gi) => {
      const subs = kids(g.id);
      panel.appendChild(item(g.name, "하위 게시판 " + subs.length + "개", "", [
        { label: "+하위", fn: async () => {
          const n = (prompt("하위 게시판 이름 (1~20자)") || "").trim(); if (!n) return;
          if (n.length > 20) return alert("20자까지만 쓸 수 있어요.");
          const r = await sb.from("boards").insert({ name: n, parent_id: g.id, position: maxPos(subs) + 1 });
          if (r.error) return dupe(r);
          loadBoardsAdmin();
        } },
        { label: "이름", fn: () => rename(g) },
        { label: "↑", fn: () => move(groups, gi, -1) },
        { label: "↓", fn: () => move(groups, gi, 1) },
        { label: "삭제", danger: true, fn: () => remove(g, true) }
      ]));
      subs.forEach((c, ci) => {
        const row = item("└ " + c.name, "", "", [
          { label: "이름", fn: () => rename(c) },
          { label: "↑", fn: () => move(subs, ci, -1) },
          { label: "↓", fn: () => move(subs, ci, 1) },
          { label: "삭제", danger: true, fn: () => remove(c, false) }
        ]);
        row.style.marginLeft = "14px"; panel.appendChild(row);
      });
    });
  }

  /* 금지어 */
  async function loadReserved() {
    const { data, error } = await sb.from("reserved_nicknames").select("word").order("word");
    if (error) return empty("불러오지 못했어요: " + error.message);
    panel.replaceChildren();
    const hint = document.createElement("p"); hint.className = "hint";
    hint.textContent = "이 단어가 들어간 닉네임은 회원이 쓸 수 없어요. 대소문자와 _ 는 구분하지 않아요. 짧은 단어는 정상 닉네임도 막을 수 있어요.";
    const f = document.createElement("form");
    const i = document.createElement("input"); i.placeholder = "금지어 추가"; i.maxLength = 20;
    const a = document.createElement("button"); a.className = "add"; a.textContent = "추가";
    f.append(i, a);
    f.onsubmit = async (e) => {
      e.preventDefault();
      const w = i.value.trim().toLowerCase(); if (!w) return;
      const { error } = await sb.from("reserved_nicknames").insert({ word: w });
      if (error) return alert(error.code === "23505" ? "이미 있는 단어예요." : error.message);
      loadReserved();
    };
    panel.append(hint, f);
    data.forEach(r => panel.appendChild(item(r.word, "", "", [{ label: "삭제", danger: true, fn: async () => {
      const { error } = await sb.from("reserved_nicknames").delete().eq("word", r.word);
      if (error) return alert(error.message);
      loadReserved();
    } }])));
  }

  /* 백업 받기: 관리자 권한으로 읽을 수 있는 모든 데이터를 JSON 파일 하나로 저장
     (데이터베이스 비밀번호 없이 가능. 비밀번호 해시·이미지 파일 자체는 포함되지 않아요) */
  const BACKUP_TABLES = [
    ["boards", "*"],
    ["notices", "id,title,content,pinned,created_at,updated_at"],
    ["posts", "*"],
    ["comments", "*"],
    ["messages", "*"],
    ["profiles", "*"],
    ["banned_users", "*"],
    ["content_locks", "*"],
    ["invite_links", "*"],
    ["invite_uses", "*"],
    ["reserved_nicknames", "*"],
  ];
  async function fetchAll(table, cols) {
    const rows = [], STEP = 1000;
    for (let from = 0; ; from += STEP) {
      const { data, error } = await sb.from(table).select(cols).range(from, from + STEP - 1);
      if (error) throw new Error(table + ": " + error.message);
      rows.push(...data);
      if (data.length < STEP) return rows;
    }
  }
  $("backup-btn").onclick = async () => {
    const btn = $("backup-btn"), msg = $("backup-msg");
    btn.disabled = true; msg.textContent = "";
    const out = { site: "E1", made_at: new Date().toISOString(), made_by: me.email, tables: {}, errors: [] };
    try {
      for (const [t, cols] of BACKUP_TABLES) {
        btn.textContent = "받는 중: " + t;
        try { out.tables[t] = await fetchAll(t, cols); } catch (e) { out.errors.push(e.message); }
      }
      btn.textContent = "받는 중: 회원 이메일";
      const m = await sb.rpc("admin_members");
      if (m.error) out.errors.push("admin_members: " + m.error.message); else out.tables.members_with_email = m.data;
      const counts = Object.entries(out.tables).map(([k, v]) => k + " " + v.length).join(", ");
      const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "E1-backup-" + new Date().toLocaleDateString("sv-SE") + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      msg.textContent = (out.errors.length ? "일부 실패(" + out.errors.length + ") · " : "완료 · ") + (blob.size / 1024).toFixed(0) + "KB · " + counts;
    } finally { btn.disabled = false; btn.textContent = "백업 받기"; }
  };

  const tabs = { members: loadMembers, boards: loadBoardsAdmin, invites: loadInvites, reserved: loadReserved };
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    empty("불러오는 중..."); tabs[b.dataset.tab]();
  });

  (async () => {
    const { data } = await sb.auth.getSession();
    if (!data.session) return location.replace("index.html");
    me = data.session.user;
    const a = await sb.from("admins").select("user_id").eq("user_id", me.id).maybeSingle();
    if (!a.data) return location.replace("main.html");      // 관리자가 아니면 게시판으로
    E1Nav.init(sb, { active: "admin", isAdmin: true });
    loadMembers();
  })();
</script>
</body>
</html>
