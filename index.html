<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>E1</title>
<script>
  // 초대/비밀번호 재설정 링크로 들어오면 비밀번호 설정 화면으로 이동
  if (/type=(invite|recovery)/.test(location.hash)) {
    location.replace("set-password.html" + location.hash);
  }
</script>
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg: #000;
    --violet: #7c5cff;
    --violet-soft: #a78bfa;
    --text: #e9e6f5;
    --muted: #8a85a3;
    --line: #2a2540;
    --danger: #ff6b81;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top, 0) 20px env(safe-area-inset-bottom, 0);
  }
  main { width: 100%; max-width: 340px; text-align: center; }

  .logo {
    width: 180px; height: 180px; display: block; margin: 0 auto 36px;
    filter: drop-shadow(0 0 28px rgba(124, 92, 255, .45));
    animation: rise 1.2s ease-out both;
  }
  @keyframes rise {
    from { opacity: 0; transform: scale(.94); filter: drop-shadow(0 0 0 rgba(124,92,255,0)); }
    to   { opacity: 1; transform: scale(1);  filter: drop-shadow(0 0 28px rgba(124,92,255,.45)); }
  }

  form { display: grid; gap: 12px; }
  input {
    width: 100%; padding: 15px 16px; font-size: 16px; color: var(--text);
    background: #0b0912; border: 1px solid var(--line); border-radius: 10px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(124,92,255,.25); }

  button {
    margin-top: 4px; padding: 15px; font-size: 16px; font-weight: 600; color: #fff;
    background: var(--violet); border: 0; border-radius: 10px; cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button:hover { background: #6a49f0; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--violet-soft); outline-offset: 3px; }

  #msg { min-height: 20px; margin: 16px 0 0; font-size: 14px; color: var(--danger); }
  .note { margin-top: 28px; font-size: 13px; color: var(--muted); line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="E1">

  <form id="login-form">
    <input id="email" type="email" placeholder="이메일" autocomplete="username" required>
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button id="submit" type="submit">로그인</button>
  </form>
  <p id="msg" role="alert"></p>
  <p class="note">초대받은 회원만 입장할 수 있어요.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // ▼ Supabase 대시보드 → Project Settings → API 에서 복사해 붙여넣기
  const SUPABASE_URL = "https://shwvlpchvsrsheycfmzc.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNod3ZscGNodnNyc2hleWNmbXpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MjAxMzMsImV4cCI6MjEwNzM5NjEzM30.IP-LZ5Arcy8jM4iORjwVg9yDSbJWlDvLigOeFG5Ap_k";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submit");

  // 이미 로그인 상태면 바로 게시판으로
  sb.auth.getSession().then(({ data }) => {
    if (data.session) location.replace("main.html");
  });

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    btn.disabled = true;
    btn.textContent = "확인 중...";

    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    });

    if (error) {
      msg.textContent = "이메일 또는 비밀번호가 맞지 않아요.";
      btn.disabled = false;
      btn.textContent = "로그인";
      return;
    }
    location.replace("main.html");
  });
</script>
</body>
</html>
