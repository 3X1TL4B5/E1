<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF0F6">
<title>로그인</title>
<script>
  // 초대/비밀번호 재설정 링크로 들어오면 비밀번호 설정 화면으로 이동
  if (/type=(invite|recovery)/.test(location.hash)) location.replace("set-password.html" + location.hash);
</script>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body class="auth-body">
<button class="icon-btn theme-fab" type="button" data-theme-toggle aria-label="테마 바꾸기"></button>

<main class="auth">
  <section class="auth-brand">
    <img class="auth-logo" data-logo src="logo.svg" alt="">
    <div class="auth-copy">
      <p class="eyebrow">MEMBERS ONLY</p>
      <h1 data-site-name>GAME HUB</h1>
      <p class="auth-lead">공지, 공략, 실시간 채팅을 한 화면에서 봐요. 초대받은 멤버만 들어올 수 있어요.</p>
      <ul class="auth-points">
        <li><b>공지·패치</b>가장 먼저 확인</li>
        <li><b>실시간 채팅</b>지금 접속한 멤버와</li>
        <li><b>공략 게시판</b>노하우 모아보기</li>
      </ul>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-card">
      <h2>로그인</h2>
      <p class="sub">초대 메일로 받은 이메일 주소로 로그인하세요.</p>
      <form id="login-form">
        <label class="field"><span>이메일</span>
          <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="username" required>
        </label>
        <label class="field"><span>비밀번호</span>
          <span class="input-wrap">
            <input class="input" id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
            <button class="icon-btn reveal" id="reveal" type="button" aria-label="비밀번호 보기" aria-pressed="false"></button>
          </span>
        </label>
        <button class="btn-primary" id="submit" type="submit">로그인</button>
      </form>
      <p id="msg" class="msg" role="alert"></p>
      <p class="note">초대받은 회원만 입장할 수 있어요.</p>
      <p class="note"><a href="reset-password.html">비밀번호를 잊으셨나요?</a></p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const msg = $("msg"), btn = $("submit"), pw = $("password"), reveal = $("reveal");

  reveal.innerHTML = GH.ICON.eye;
  reveal.addEventListener("click", () => {
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    reveal.setAttribute("aria-pressed", String(show));
    reveal.setAttribute("aria-label", show ? "비밀번호 숨기기" : "비밀번호 보기");
  });

  if (GH.DEMO) $("password").removeAttribute("required");

  // 이미 로그인 상태면 바로 홈으로
  GH.session().then((s) => { if (s) location.replace("main.html"); });

  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    btn.disabled = true;
    btn.textContent = "확인 중...";
    const { error } = await GH.signIn($("email").value.trim(), pw.value);
    if (error) {
      msg.textContent = "이메일 또는 비밀번호가 맞지 않아요.";
      btn.disabled = false;
      btn.textContent = "로그인";
      return;
    }
    location.replace("main.html");
  });
</script>
</body>
</html>
