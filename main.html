<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>E1</title>
<link rel="icon" href="logo.png">
<style>
  :root { --bg:#000; --violet:#7c5cff; --violet-soft:#a78bfa; --text:#e9e6f5; --muted:#8a85a3; --line:#1c1830; --panel:#0b0912; --danger:#ff6b81; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
  .hidden { display:none !important; }
  a { color:inherit; text-decoration:none; }

  .center { min-height:90vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:340px; text-align:center; }
  .card img { width:120px; height:120px; filter:drop-shadow(0 0 24px rgba(124,92,255,.45)); }
  h1 { font-size:20px; margin:16px 0 8px; }
  .sub { color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 24px; }
  form { display:grid; gap:12px; }
  input { width:100%; padding:15px 16px; font-size:16px; color:var(--text); background:var(--panel); border:1px solid #2a2540; border-radius:10px; outline:none; }
  input:focus { border-color:var(--violet); box-shadow:0 0 0 3px rgba(124,92,255,.25); }
  .primary { padding:15px; font-size:16px; font-weight:600; color:#fff; background:var(--violet); border:0; border-radius:10px; cursor:pointer; }
  .primary:disabled { opacity:.6; }
  .msg { min-height:20px; margin:14px 0 0; font-size:14px; color:var(--danger); }

  .home { max-width:720px; margin:0 auto; padding:36px 24px 56px; }
  .hello { font-size:14px; color:var(--muted); margin:0 0 6px; }
  .home h2 { font-size:30px; line-height:1.3; margin:0 0 32px; letter-spacing:-.02em; }
  .home h2 b { color:var(--violet-soft); }
  .label { font-size:12px; letter-spacing:.14em; color:var(--muted); margin:0 0 6px; }
  .row { display:flex; align-items:center; gap:16px; padding:20px 2px; border-bottom:1px solid var(--line); }
  .row:hover { background:#0a0814; }
  .row .no { font-size:13px; color:var(--muted); width:26px; flex:none; }
  .row .nm { flex:1; } .row .nm b { display:block; font-size:22px; font-weight:700; }
  .row .nm span { font-size:13px; color:var(--muted); margin-top:4px; display:block; }
  .row .ar { color:var(--violet-soft); font-size:20px; }
  .recent { margin-top:44px; }
  .post { display:block; width:100%; text-align:left; padding:14px 2px; background:none; border:0; border-bottom:1px solid var(--line); color:var(--text); cursor:pointer; font-family:inherit; }
  .post .t { font-size:16px; font-weight:600; overflow-wrap:anywhere; }
  .post .m { font-size:13px; color:var(--muted); margin-top:5px; }
  .post .b { color:var(--violet-soft); }
  .empty { color:var(--muted); font-size:14px; padding:20px 2px; }
</style>
</head>
<body>

<!-- 닉네임 정하기 -->
<section id="nick-view" class="center hidden">
  <div class="card">
    <img src="logo.png" alt="E1">
    <h1>닉네임을 정해 주세요</h1>
    <p class="sub">게시판에는 이메일 대신 닉네임만 보여요.<br>한글·영문·숫자·_ 로 2~12자</p>
    <form id="nick-form">
      <input id="nick" type="text" placeholder="닉네임" maxlength="12" autocomplete="off" required>
      <button class="primary" id="nick-btn" type="submit">시작하기</button>
    </form>
    <p id="nick-msg" class="msg" role="alert"></p>
  </div>
</section>

<!-- 홈 -->
<section id="home-view" class="hidden">
  <div class="home">
    <p class="hello"><span id="me"></span> 님, 어서 오세요</p>
    <h2>오늘은 어떤 이야기를<br><b>나눠 볼까요?</b></h2>
    <div class="label">게시판</div>
    <div id="boards"></div>
    <div class="recent">
      <div class="label">최근 글</div>
      <div id="recent"></div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="nav.js"></script>
<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  let user = null, isAdmin = false;
  const fmt = (s) => new Date(s).toLocaleDateString("ko-KR", { year: "2-digit", month: "numeric", day: "numeric" });

  function enterHome(nickname) {
    $("nick-view").classList.add("hidden");
    $("home-view").classList.remove("hidden");
    $("me").textContent = nickname;
    E1Nav.init(sb, { active: "home", isAdmin });
    const box = $("boards");
    E1Nav.boards.forEach((b, i) => {
      const a = document.createElement("a"); a.className = "row"; a.href = b.href;
      const no = document.createElement("span"); no.className = "no"; no.textContent = String(i + 1).padStart(2, "0");
      const nm = document.createElement("div"); nm.className = "nm";
      const t = document.createElement("b"); t.textContent = b.name;
      const d = document.createElement("span"); d.textContent = b.desc; nm.append(t, d);
      const ar = document.createElement("span"); ar.className = "ar"; ar.textContent = "→";
      a.append(no, nm, ar); box.appendChild(a);
    });
    loadRecent();
  }

  async function loadRecent() {
    const box = $("recent");
    const { data, error } = await sb.from("posts").select("id,title,board,created_at").order("created_at", { ascending: false }).limit(5);
    if (error || !data.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = error ? "불러오지 못했어요." : "아직 글이 없어요."; box.appendChild(d); return; }
    data.forEach(p => {
      const b = document.createElement("button"); b.className = "post";
      const t = document.createElement("div"); t.className = "t"; t.textContent = p.title;
      const m = document.createElement("div"); m.className = "m";
      const tag = document.createElement("span"); tag.className = "b"; tag.textContent = E1Nav.boardName(p.board);
      m.append(tag, " · " + fmt(p.created_at)); b.append(t, m);
      b.onclick = () => { location.href = "board.html?b=" + p.board + "&id=" + p.id; }; box.appendChild(b);
    });
  }

  (async () => {
    const { data } = await sb.auth.getSession();
    if (!data.session) return location.replace("index.html");
    user = data.session.user;
    const a = await sb.from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
    isAdmin = !!a.data;
    const { data: p } = await sb.from("profiles").select("nickname").eq("id", user.id).maybeSingle();
    if (p) enterHome(p.nickname); else $("nick-view").classList.remove("hidden");
  })();

  $("nick-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const n = $("nick").value.trim(), msg = $("nick-msg"), btn = $("nick-btn");
    msg.textContent = "";
    if (!/^[가-힣A-Za-z0-9_]{2,12}$/.test(n)) { msg.textContent = "한글·영문·숫자·_ 로 2~12자만 쓸 수 있어요."; return; }
    btn.disabled = true;
    const { error } = await sb.from("profiles").insert({ id: user.id, nickname: n });
    btn.disabled = false;
    if (error) {
      if (error.code === "23505") msg.textContent = "이미 사용 중인 닉네임이에요.";
      else if ((error.message || "").includes("reserved_nickname")) msg.textContent = "사용할 수 없는 닉네임이에요.";
      else msg.textContent = "저장하지 못했어요: " + (error.message || error.code);
      return;
    }
    enterHome(n);
  });
</script>
</body>
</html>
