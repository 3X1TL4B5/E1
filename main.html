<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>E1</title>
<link rel="icon" href="logo.png">
<style>
  :root { --bg:#000; --violet:#7c5cff; --violet-soft:#a78bfa; --text:#e9e6f5; --muted:#8a85a3; --line:#2a2540; --panel:#0b0912; --danger:#ff6b81; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }

  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0); background:var(--bg); z-index:5; }
  header img { width:36px; height:36px; }
  .who { display:flex; align-items:center; gap:12px; font-size:14px; color:var(--muted); }
  .who b { color:var(--text); font-weight:600; }
  .ghost { background:none; border:1px solid var(--line); color:var(--muted); padding:7px 12px; border-radius:8px; font-size:13px; }
  .ghost:hover { color:var(--text); border-color:var(--violet); }
  .primary { padding:14px; font-size:16px; font-weight:600; color:#fff; background:var(--violet); border:0; border-radius:10px; }
  .primary:hover { background:#6a49f0; }
  .primary:disabled { opacity:.6; }
  .danger { color:var(--danger); border-color:#4a2530; }

  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .center { min-height:70vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:340px; text-align:center; }
  .card img { width:120px; height:120px; filter:drop-shadow(0 0 24px rgba(124,92,255,.45)); }
  h1 { font-size:20px; margin:16px 0 8px; }
  .sub { color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 24px; }
  form { display:grid; gap:12px; }
  input, textarea { width:100%; padding:14px 16px; font-size:16px; font-family:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:10px; outline:none; }
  input:focus, textarea:focus { border-color:var(--violet); box-shadow:0 0 0 3px rgba(124,92,255,.25); }
  textarea { min-height:240px; resize:vertical; line-height:1.6; }
  .msg { min-height:20px; margin:12px 0 0; font-size:14px; color:var(--danger); }

  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:4px; }
  .chip { flex:none; padding:7px 14px; font-size:14px; color:var(--muted); background:none; border:1px solid var(--line); border-radius:999px; }
  .chip.on { color:#fff; background:var(--violet); border-color:var(--violet); }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:8px 0 12px; }
  .bar h2 { margin:0; font-size:17px; }

  .post { display:block; width:100%; text-align:left; padding:14px 4px; background:none; border:0; border-bottom:1px solid var(--line); color:var(--text); }
  .post:hover { background:#0e0b18; }
  .post .t { font-size:16px; font-weight:600; margin-bottom:6px; overflow-wrap:anywhere; }
  .post .m { font-size:13px; color:var(--muted); }
  .tag { color:var(--violet-soft); }
  .empty { text-align:center; color:var(--muted); padding:48px 0; }

  .detail h2 { font-size:21px; margin:12px 0 8px; overflow-wrap:anywhere; }
  .detail .m { font-size:13px; color:var(--muted); margin-bottom:20px; }
  .detail .body { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.75; font-size:16px; }
  .row { display:flex; gap:8px; margin-top:24px; }
  .row > * { flex:1; }
</style>
</head>
<body>

<!-- 닉네임 정하기 -->
<section id="nick-view" class="center hidden">
  <div class="card">
    <img src="logo.png" alt="E1">
    <h1>닉네임을 정해 주세요</h1>
    <p class="sub">게시판에는 이메일 대신 닉네임만 보여요.<br>한글·영문·숫자·_ 로 2~12자</p>
    <form id="nick-form">
      <input id="nick" type="text" placeholder="닉네임" maxlength="12" autocomplete="off" required>
      <button class="primary" id="nick-btn" type="submit">시작하기</button>
    </form>
    <p id="nick-msg" class="msg" role="alert"></p>
  </div>
</section>

<!-- 게시판 -->
<section id="board-view" class="hidden">
  <header>
    <img src="logo.png" alt="E1">
    <div class="who"><span><b id="me"></b> 님</span><a class="ghost" href="chat.html" style="text-decoration:none">채팅</a><a class="ghost hidden" id="admin-link" href="admin.html" style="text-decoration:none">관리</a><button class="ghost" id="logout">로그아웃</button></div>
  </header>

  <div class="wrap">
    <!-- 목록 -->
    <div id="list-view">
      <div class="chips" id="chips"></div>
      <div class="bar"><h2 id="list-title">전체</h2><button class="primary" id="go-write" style="padding:9px 16px;font-size:14px">글쓰기</button></div>
      <div id="posts"></div>
    </div>

    <!-- 글쓰기 -->
    <div id="write-view" class="hidden">
      <div class="bar"><h2>글쓰기</h2></div>
      <form id="write-form">
        <input id="w-cat" list="cat-list" placeholder="카테고리 (고르거나 새로 입력)" maxlength="20" autocomplete="off" required>
        <datalist id="cat-list"></datalist>
        <input id="w-title" placeholder="제목" maxlength="100" required>
        <textarea id="w-content" placeholder="내용" maxlength="5000" required></textarea>
        <div class="row">
          <button class="ghost" type="button" id="w-cancel" style="padding:14px">취소</button>
          <button class="primary" id="w-btn" type="submit">등록</button>
        </div>
      </form>
      <p id="w-msg" class="msg" role="alert"></p>
    </div>

    <!-- 글 보기 -->
    <div id="detail-view" class="hidden detail">
      <button class="ghost" id="back">← 목록</button>
      <h2 id="d-title"></h2>
      <div class="m" id="d-meta"></div>
      <div class="body" id="d-body"></div>
      <div class="row"><button class="ghost danger hidden" id="d-del" style="padding:12px">삭제</button></div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  let user = null, isAdmin = false, nickname = "", categories = [], currentCat = null, currentPost = null;

  const fmt = (s) => new Date(s).toLocaleDateString("ko-KR", { year: "2-digit", month: "numeric", day: "numeric" });
  const show = (name) => ["list", "write", "detail"].forEach(v => $(v + "-view").classList.toggle("hidden", v !== name));

  /* ---------- 시작: 로그인 확인 + 프로필 ---------- */
  async function init() {
    const { data } = await sb.auth.getSession();
    if (!data.session) { location.replace("index.html"); return; }
    user = data.session.user;
    const a = await sb.from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
    isAdmin = !!a.data;
    const { data: p } = await sb.from("profiles").select("nickname").eq("id", user.id).maybeSingle();
    if (p) enterBoard(p.nickname); else $("nick-view").classList.remove("hidden");
  }
  async function enterBoard(n) {
    nickname = n;
    $("nick-view").classList.add("hidden");
    $("board-view").classList.remove("hidden");
    $("me").textContent = n;
    $("admin-link").classList.toggle("hidden", !isAdmin);
    await loadCategories();
    await loadPosts();
  }

  $("nick-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const n = $("nick").value.trim(), msg = $("nick-msg"), btn = $("nick-btn");
    msg.textContent = "";
    if (!/^[가-힣A-Za-z0-9_]{2,12}$/.test(n)) { msg.textContent = "한글·영문·숫자·_ 로 2~12자만 쓸 수 있어요."; return; }
    btn.disabled = true;
    const { error } = await sb.from("profiles").insert({ id: user.id, nickname: n });
    btn.disabled = false;
    if (error) { if (error.code === "23505") msg.textContent = "이미 사용 중인 닉네임이에요.";
      else if ((error.message || "").includes("reserved_nickname")) msg.textContent = "사용할 수 없는 닉네임이에요.";
      else msg.textContent = "저장하지 못했어요: " + (error.message || error.code);
      return; }
    enterBoard(n);
  });
  $("logout").addEventListener("click", async () => { await sb.auth.signOut(); location.replace("index.html"); });

  /* ---------- 카테고리 ---------- */
  async function loadCategories() {
    const { data } = await sb.from("categories").select("id,name").order("name");
    categories = data || [];
    const chips = $("chips"); chips.replaceChildren();
    const mk = (label, id) => {
      const b = document.createElement("button");
      b.className = "chip" + (currentCat === id ? " on" : ""); b.textContent = label;
      b.onclick = () => { currentCat = id; $("list-title").textContent = label; loadCategories(); loadPosts(); };
      chips.appendChild(b);
    };
    mk("전체", null);
    categories.forEach(c => mk(c.name, c.id));
    const dl = $("cat-list"); dl.replaceChildren();
    categories.forEach(c => { const o = document.createElement("option"); o.value = c.name; dl.appendChild(o); });
  }

  /* ---------- 글 목록 ---------- */
  async function loadPosts() {
    show("list");
    const box = $("posts"); box.replaceChildren();
    let q = sb.from("posts").select("id,title,created_at,categories(name),profiles(nickname)").order("created_at", { ascending: false }).limit(50);
    if (currentCat) q = q.eq("category_id", currentCat);
    const { data, error } = await q;
    if (error) { box.innerHTML = ""; const d = document.createElement("div"); d.className = "empty"; d.textContent = "불러오지 못했어요: " + error.message; box.appendChild(d); return; }
    if (!data.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = "아직 글이 없어요. 첫 글을 써 보세요."; box.appendChild(d); return; }
    data.forEach(p => {
      const b = document.createElement("button"); b.className = "post";
      const t = document.createElement("div"); t.className = "t"; t.textContent = p.title;
      const m = document.createElement("div"); m.className = "m";
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = p.categories ? p.categories.name : "";
      m.append(tag, " · " + (p.profiles ? p.profiles.nickname : "탈퇴한 회원") + " · " + fmt(p.created_at));
      b.append(t, m); b.onclick = () => openPost(p.id); box.appendChild(b);
    });
  }

  /* ---------- 글 보기 ---------- */
  async function openPost(id) {
    const { data, error } = await sb.from("posts").select("id,title,content,created_at,author_id,categories(name),profiles(nickname)").eq("id", id).single();
    if (error) { alert("글을 불러오지 못했어요."); return; }
    currentPost = data;
    $("d-title").textContent = data.title;
    $("d-meta").textContent = (data.categories ? data.categories.name + " · " : "") + (data.profiles ? data.profiles.nickname : "탈퇴한 회원") + " · " + fmt(data.created_at);
    $("d-body").textContent = data.content;
    $("d-del").classList.toggle("hidden", data.author_id !== user.id && !isAdmin);
    show("detail"); window.scrollTo(0, 0);
  }
  $("back").onclick = () => loadPosts();
  $("d-del").onclick = async () => {
    if (!confirm("이 글을 삭제할까요?")) return;
    const { error } = await sb.from("posts").delete().eq("id", currentPost.id);
    if (error) { alert("삭제하지 못했어요."); return; }
    await loadCategories(); loadPosts();
  };

  /* ---------- 글쓰기 ---------- */
  $("go-write").onclick = () => { $("w-msg").textContent = ""; $("w-cat").value = categories.find(c => c.id === currentCat)?.name || ""; show("write"); };
  $("w-cancel").onclick = () => loadPosts();

  async function getOrCreateCategory(name) {
    const hit = categories.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (hit) return hit.id;
    let { data, error } = await sb.from("categories").insert({ name }).select("id").single();
    if (error && error.code === "23505") {            // 동시에 누가 만든 경우
      const r = await sb.from("categories").select("id,name").ilike("name", name).limit(1).single();
      data = r.data; error = r.error;
    }
    if (error) throw error;
    return data.id;
  }

  $("write-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("w-msg"), btn = $("w-btn");
    const name = $("w-cat").value.trim(), title = $("w-title").value.trim(), content = $("w-content").value.trim();
    msg.textContent = "";
    if (!name || !title || !content) { msg.textContent = "카테고리, 제목, 내용을 모두 입력해 주세요."; return; }
    btn.disabled = true;
    try {
      const category_id = await getOrCreateCategory(name);
      const { error } = await sb.from("posts").insert({ title, content, category_id });
      if (error) throw error;
      $("w-title").value = ""; $("w-content").value = "";
      currentCat = null; $("list-title").textContent = "전체";
      await loadCategories(); await loadPosts();
    } catch (err) {
      msg.textContent = (err.message || "").includes("row-level security") ? "이용이 제한된 계정이에요." : "등록하지 못했어요: " + (err.message || err.code);
    }
    btn.disabled = false;
  });

  init();
</script>
</body>
</html>
