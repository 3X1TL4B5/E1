<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF0F6">
<title>채팅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  /* 채팅은 한 화면에 꽉 차게: 상단바 + 제목 + (스크롤되는 대화 + 입력창) */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .chat-page { flex: 1; min-height: 0; width: 100%; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
  .chat-tile { flex: 1; min-height: 0; padding: 0; gap: 0; overflow: hidden; }
  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .day { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface-2); padding: 2px 10px; border-radius: 999px; margin: 10px 0 4px; }
  #list > * { flex: none; }
  .msg { max-width: min(82%, 640px); display: flex; flex-direction: column; margin: 0; }
  .msg .name { font-size: 12px; color: var(--accent-ink); margin: 0 4px 3px; font-weight: 600; }
  .bubble { padding: 9px 13px; border-radius: 16px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); color: var(--fg); border-top-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin: 3px 4px 0; display: flex; gap: 8px; }
  .meta button { background: none; border: 0; color: var(--muted); font-size: 11px; padding: 0; cursor: pointer; }
  .meta button:hover { color: var(--danger); }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.mine .bubble { background: var(--accent); color: var(--on-accent); border-top-left-radius: 16px; border-top-right-radius: 4px; }
  #list .empty { margin: auto; }
  #form { flex: none; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--surface); }
  #form input { flex: 1; min-width: 0; border-radius: 22px; padding: 12px 16px; }
  #send { flex: none; border-radius: 22px; padding: 0 20px; }
  @media (max-width: 699px), (orientation: landscape) and (max-height: 540px) {
    .chat-page .page-head { display: none; }
    .chat-page { padding-top: 10px; gap: 10px; }
  }
</style>
</head>
<body>
<main class="page chat-page">
  <div class="page-head"><div><p>커뮤니티</p><h1>전체 채팅</h1></div></div>
  <section class="tile chat-tile">
    <div id="list"><div class="empty" id="empty">불러오는 중...</div></div>
    <form id="form">
      <input id="text" placeholder="메시지 입력" maxlength="500" autocomplete="off" required>
      <button class="primary" id="send" type="submit">전송</button>
    </form>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="nav.js"></script>
<script>
  const sb = GH.sb();
  const $ = (id) => document.getElementById(id);
  const list = $("list");
  const names = {};          // 작성자 id → 닉네임
  const shown = new Set();   // 이미 화면에 있는 메시지 id
  let me = null, isAdmin = false, adminIds = new Set(), lastId = 0, lastDay = "";

  function nameEl(nick, id) {
    const w = document.createElement("span"), s = document.createElement("span");
    s.textContent = nick; w.appendChild(s);
    if (adminIds.has(id)) {
      s.className = "adm";
      const b = document.createElement("span"); b.className = "badge"; b.textContent = "관리자"; w.appendChild(b);
    }
    return w;
  }

  const nearBottom = () => list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  const toBottom = () => { list.scrollTop = list.scrollHeight; };

  function addMessage(m) {
    if (shown.has(m.id)) return;
    shown.add(m.id); lastId = Math.max(lastId, m.id);
    const stick = nearBottom() || m.author_id === me.id;
    $("empty")?.remove();

    const d = new Date(m.created_at);
    const day = d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
    if (day !== lastDay) {
      lastDay = day;
      const dv = document.createElement("div"); dv.className = "day"; dv.textContent = day; list.appendChild(dv);
    }

    const mine = m.author_id === me.id;
    const box = document.createElement("div"); box.className = "msg" + (mine ? " mine" : ""); box.dataset.id = m.id;
    if (!mine) { const n = document.createElement("div"); n.className = "name"; n.appendChild(nameEl(names[m.author_id] || "회원", m.author_id)); box.appendChild(n); }
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.content; box.appendChild(b);
    const meta = document.createElement("div"); meta.className = "meta";
    meta.append(d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" }));
    if (mine || isAdmin) {
      const del = document.createElement("button"); del.type = "button"; del.textContent = "삭제";
      del.onclick = async () => { if (confirm("이 메시지를 삭제할까요?")) { await sb.from("messages").delete().eq("id", m.id); removeMessage(m.id); } };
      meta.appendChild(del);
    }
    box.appendChild(meta); list.appendChild(box);
    if (stick) toBottom();
  }
  function removeMessage(id) { list.querySelector('.msg[data-id="' + id + '"]')?.remove(); shown.delete(id); }

  async function fetchNames(ids) {
    const need = ids.filter(i => !names[i]);
    if (!need.length) return;
    const { data } = await sb.from("profiles").select("id,nickname").in("id", need);
    (data || []).forEach(p => names[p.id] = p.nickname);
  }

  async function loadRecent() {
    const { data, error } = await sb.from("messages").select("id,author_id,content,created_at").order("id", { ascending: false }).limit(60);
    if (error) { $("empty").textContent = "불러오지 못했어요: " + error.message; return; }
    const rows = data.reverse();
    await fetchNames([...new Set(rows.map(r => r.author_id))]);
    if (!rows.length) { $("empty").textContent = "아직 대화가 없어요. 첫 메시지를 보내 보세요."; return; }
    rows.forEach(addMessage); toBottom();
  }
  async function syncMissed() {          // 화면을 껐다 켰을 때 놓친 메시지 채우기
    const { data } = await sb.from("messages").select("id,author_id,content,created_at").gt("id", lastId).order("id");
    if (data?.length) { await fetchNames([...new Set(data.map(r => r.author_id))]); data.forEach(addMessage); }
  }

  async function init() {
    const { data } = await sb.auth.getSession();
    if (!data.session) { location.replace("index.html"); return; }
    me = data.session.user;
    const a = await sb.from("admins").select("user_id");
    adminIds = new Set((a.data || []).map(r => r.user_id));
    isAdmin = adminIds.has(me.id);
    const { data: p } = await sb.from("profiles").select("nickname").eq("id", me.id).maybeSingle();
    if (!p) { location.replace("main.html"); return; }   // 닉네임부터 정하기
    names[me.id] = p.nickname;
    // 입력창이 화면 아래에 있으니 휴대폰 탭바는 끄고, 글쓰기 버튼도 숨겨요
    E1Nav.init(sb, { active: "chat", isAdmin, write: false, tabbar: false });

    await loadRecent();
    sb.channel("chat-room")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, async (e) => {
        await fetchNames([e.new.author_id]); addMessage(e.new);
      })
      .on("postgres_changes", { event: "DELETE", schema: "public", table: "messages" }, (e) => removeMessage(e.old.id))
      .subscribe();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) syncMissed(); });
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const content = $("text").value.trim();
    if (!content) return;
    $("send").disabled = true;
    const { data, error } = await sb.from("messages").insert({ content }).select("id,author_id,content,created_at").single();
    $("send").disabled = false;
    if (error) { alert((error.message || "").includes("row-level security") ? "이용이 제한된 계정이에요." : "전송하지 못했어요: " + error.message); return; }
    $("text").value = ""; addMessage(data); $("text").focus();
  });

  init();
</script>
</body>
</html>
