<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF0F6">
<title>게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<main class="page">
  <div id="list-view" class="stack">
    <div class="page-head">
      <div><h1 id="b-name"></h1><p class="hint" id="b-desc" style="margin-top:4px"></p></div>
    </div>
    <section class="tile"><div class="list" id="posts"><div class="skel"></div></div></section>
  </div>

  <div id="write-view" class="stack hidden">
    <div class="page-head"><div><h1 id="w-name"></h1></div></div>
    <section class="tile">
      <form id="write-form">
        <input id="w-title" placeholder="제목" maxlength="100" required>
        <textarea id="w-content" placeholder="내용" maxlength="5000" required></textarea>
        <div class="row">
          <button class="ghost" type="button" id="w-cancel">취소</button>
          <button class="primary" id="w-btn" type="submit">등록</button>
        </div>
      </form>
      <p id="w-msg" class="msg" role="alert"></p>
    </section>
  </div>

  <div id="detail-view" class="stack hidden">
    <div><button class="ghost" id="back" type="button">← 목록</button></div>
    <section class="tile detail">
      <h2 id="d-title"></h2>
      <div class="m" id="d-meta"></div>
      <div class="body" id="d-body"></div>
      <div class="row"><button class="ghost danger hidden" id="d-del" type="button">삭제</button></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="nav.js"></script>
<script>
  const sb = GH.sb();
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const key = params.get("b") || "";          // boards.id
  let info = null;                             // GH.loadBoards() 뒤에 정해져요
  let user = null, isAdmin = false, adminIds = new Set(), currentPost = null;

  const fmt = (s) => new Date(s).toLocaleDateString("ko-KR", { year: "2-digit", month: "numeric", day: "numeric" });
  const show = (n) => ["list", "write", "detail"].forEach(v => $(v + "-view").classList.toggle("hidden", v !== n));
  function nameEl(nick, id) {
    const w = document.createElement("span"), s = document.createElement("span");
    s.textContent = nick; w.appendChild(s);
    if (adminIds.has(id)) { s.className = "adm"; const b = document.createElement("span"); b.className = "badge"; b.textContent = "관리자"; w.appendChild(b); }
    return w;
  }

  async function loadPosts() {
    history.replaceState(null, "", "board.html?b=" + key);
    show("list");
    const box = $("posts"); box.replaceChildren();
    const { data, error } = await sb.from("posts").select("id,title,created_at,author_id,profiles(nickname)").eq("board_id", info.id).order("created_at", { ascending: false }).limit(50);
    const note = (t) => { const d = document.createElement("div"); d.className = "empty"; d.textContent = t; box.appendChild(d); };
    if (error) return note("불러오지 못했어요: " + error.message);
    if (!data.length) return note("아직 글이 없어요. 첫 글을 써 보세요.");
    data.forEach(p => {
      const b = document.createElement("button"); b.className = "list-item"; b.type = "button";
      const t = document.createElement("div"); t.className = "t"; t.textContent = p.title;
      const m = document.createElement("div"); m.className = "m";
      m.append(nameEl(p.profiles ? p.profiles.nickname : "탈퇴한 회원", p.author_id), " · " + fmt(p.created_at));
      b.append(t, m); b.onclick = () => openPost(p.id); box.appendChild(b);
    });
  }

  async function openPost(id) {
    const { data, error } = await sb.from("posts").select("id,title,content,created_at,author_id,board_id,profiles(nickname)").eq("id", id).single();
    if (error || String(data.board_id) !== key) { alert("글을 불러오지 못했어요."); return loadPosts(); }
    currentPost = data;
    history.replaceState(null, "", "board.html?b=" + key + "&id=" + id);
    $("d-title").textContent = data.title;
    $("d-meta").replaceChildren(nameEl(data.profiles ? data.profiles.nickname : "탈퇴한 회원", data.author_id), " · " + fmt(data.created_at));
    $("d-body").textContent = data.content;
    $("d-del").classList.toggle("hidden", data.author_id !== user.id && !isAdmin);
    show("detail"); window.scrollTo(0, 0);
  }

  function openWrite() { $("w-msg").textContent = ""; show("write"); window.scrollTo(0, 0); $("w-title").focus(); }

  $("back").onclick = loadPosts;
  $("d-del").onclick = async () => {
    if (!confirm("이 글을 삭제할까요?")) return;
    const { error } = await sb.from("posts").delete().eq("id", currentPost.id);
    if (error) return alert("삭제하지 못했어요.");
    loadPosts();
  };
  $("w-cancel").onclick = loadPosts;

  $("write-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("w-msg"), btn = $("w-btn");
    const title = $("w-title").value.trim(), content = $("w-content").value.trim();
    msg.textContent = "";
    if (!title || !content) { msg.textContent = "제목과 내용을 입력해 주세요."; return; }
    btn.disabled = true;
    const { error } = await sb.from("posts").insert({ title, content, board_id: info.id });
    btn.disabled = false;
    if (error) { msg.textContent = (error.message || "").includes("row-level security") ? "이용이 제한된 계정이에요." : "등록하지 못했어요: " + (error.message || error.code); return; }
    $("w-title").value = ""; $("w-content").value = "";
    loadPosts();
  });

  (async () => {
    const { data } = await sb.auth.getSession();
    if (!data.session) return location.replace("index.html");
    user = data.session.user;
    const p = await sb.from("profiles").select("nickname").eq("id", user.id).maybeSingle();
    if (!p.data) return location.replace("main.html");
    await GH.loadBoards();
    info = E1Nav.boards.find(b => b.key === key && b.key !== "notice");
    if (!info) return location.replace("main.html");      // 없는 게시판이면 홈으로
    const a = await sb.from("admins").select("user_id");
    adminIds = new Set((a.data || []).map(r => r.user_id)); isAdmin = adminIds.has(user.id);
    E1Nav.init(sb, { active: key, isAdmin, write: { label: "글쓰기", onClick: openWrite } });
    $("b-name").textContent = info.name; $("w-name").textContent = info.name + " 글쓰기";
    $("b-desc").textContent = info.desc; document.title = (typeof SITE_NAME === "string" ? SITE_NAME : "E1") + " · " + info.name;
    const id = params.get("id");
    if (id) openPost(id); else loadPosts();
  })();
</script>
</body>
</html>
