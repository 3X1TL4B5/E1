<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF0F6">
<title>가입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body class="auth-body">
<button class="icon-btn theme-fab" type="button" data-theme-toggle aria-label="테마 바꾸기"></button>

<main class="auth">
  <section class="auth-brand">
    <div class="auth-copy">
      <p class="eyebrow">MEMBERS ONLY</p>
      <h1 data-site-name>E1</h1>
      <p class="auth-lead">초대 링크로 가입할 수 있어요. 이메일 인증까지 마치면 바로 입장해요.</p>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-card">
      <div id="s-check"><p class="sub">초대 링크를 확인하는 중...</p></div>

      <div id="s-bad" class="hidden">
        <h2>입장할 수 없어요</h2>
        <p class="sub">초대 링크가 없거나, 만료되었거나, 인원이 가득 찼어요.<br>관리자에게 새 링크를 요청해 주세요.</p>
        <p class="note"><a href="index.html">로그인 화면으로</a></p>
      </div>

      <div id="s-form" class="hidden">
        <h2>가입하기</h2>
        <p class="sub">초대를 받았어요. 이메일과 비밀번호를 정해 주세요.</p>
        <form id="form">
          <label class="field"><span>이메일</span><input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="username" required></label>
          <label class="field"><span>비밀번호</span><input class="input" id="pw1" type="password" placeholder="8자 이상" autocomplete="new-password" minlength="8" required></label>
          <label class="field"><span>비밀번호 확인</span><input class="input" id="pw2" type="password" placeholder="한 번 더 입력" autocomplete="new-password" minlength="8" required></label>
          <button class="btn-primary" id="btn" type="submit">인증 코드 받기</button>
        </form>
        <p id="msg" class="msg" role="alert"></p>
        <p class="note">이미 계정이 있나요? <a href="index.html">로그인</a></p>
      </div>

      <div id="s-otp" class="hidden">
        <h2>이메일 인증</h2>
        <p class="sub"><b id="sent-to"></b> 로 보낸<br>인증 코드를 입력해 주세요.</p>
        <form id="otp-form">
          <label class="field"><span>인증 코드</span><input class="input otp" id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="000000" required></label>
          <button class="btn-primary" id="otp-btn" type="submit">가입 완료</button>
        </form>
        <p id="otp-msg" class="msg" role="alert"></p>
        <button class="link-btn" id="resend" type="button">코드 다시 받기</button>
        <p class="note">메일이 안 보이면 스팸함도 확인해 주세요.</p>
      </div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const sb = GH.sb();
  const $ = (id) => document.getElementById(id);
  const code = new URLSearchParams(location.search).get("code") || "";
  let email = "";
  const step = (n) => ["check", "bad", "form", "otp"].forEach(s => $("s-" + s).classList.toggle("hidden", s !== n));

  (async () => {
    if (!code) return step("bad");
    const { data } = await sb.rpc("check_invite", { c: code });
    step(data === true ? "form" : "bad");
  })();

  function cooldown(sec) {
    const b = $("resend"); b.disabled = true;
    const t = setInterval(() => {
      if (--sec <= 0) { clearInterval(t); b.disabled = false; b.textContent = "코드 다시 받기"; }
      else b.textContent = "코드 다시 받기 (" + sec + "초)";
    }, 1000);
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("msg"), btn = $("btn");
    email = $("email").value.trim();
    const p1 = $("pw1").value, p2 = $("pw2").value;
    msg.textContent = ""; msg.className = "msg";
    if (p1.length < 8) { msg.textContent = "비밀번호는 8자 이상이어야 해요."; return; }
    if (p1 !== p2) { msg.textContent = "두 비밀번호가 서로 달라요."; return; }
    btn.disabled = true; btn.textContent = "보내는 중...";
    const { data, error } = await sb.auth.signUp({ email, password: p1, options: { data: { invite_code: code } } });
    btn.disabled = false; btn.textContent = "인증 코드 받기";
    if (error) {
      const m = error.message || "";
      msg.textContent = /database error/i.test(m) ? "초대 링크가 만료되었거나 인원이 가득 찼어요."
        : (error.status === 429 || /rate|seconds/i.test(m)) ? "요청이 너무 많아요. 잠시 뒤 다시 시도해 주세요."
        : "가입하지 못했어요: " + m;
      return;
    }
    if (data.user && data.user.identities && data.user.identities.length === 0) {
      msg.textContent = "이미 가입된 이메일이에요. 로그인하거나 비밀번호를 찾아 주세요."; return;
    }
    if (data.session) { location.replace("main.html"); return; }
    $("sent-to").textContent = email; step("otp"); cooldown(60);
  });

  $("otp-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("otp-msg"), btn = $("otp-btn");
    msg.textContent = ""; msg.className = "msg"; btn.disabled = true;
    const { error } = await sb.auth.verifyOtp({ email, token: $("otp").value.trim(), type: "signup" });
    btn.disabled = false;
    if (error) { msg.textContent = "코드가 맞지 않거나 만료되었어요."; return; }
    location.replace("main.html");
  });

  $("resend").addEventListener("click", async () => {
    const msg = $("otp-msg"); msg.className = "msg";
    const { error } = await sb.auth.resend({ type: "signup", email });
    if (error) { msg.textContent = "잠시 뒤 다시 시도해 주세요."; return; }
    msg.className = "msg ok"; msg.textContent = "코드를 다시 보냈어요."; cooldown(60);
  });
</script>
</body>
</html>
