<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF0F6">
<title>비밀번호 찾기</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body class="auth-body">
<button class="icon-btn theme-fab" type="button" data-theme-toggle aria-label="테마 바꾸기"></button>

<main class="auth">
  <section class="auth-brand">
    <img class="auth-logo" data-logo src="logo.svg" alt="">
    <div class="auth-copy">
      <p class="eyebrow">MEMBERS ONLY</p>
      <h1 data-site-name>GAME HUB</h1>
      <p class="auth-lead">가입한 이메일로 인증 코드를 보내 드려요.</p>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-card">
      <div id="s1">
        <h2>비밀번호 찾기</h2>
        <p class="sub">가입한 이메일 주소를 입력하세요.</p>
        <form id="f1">
          <label class="field"><span>이메일</span><input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="username" required></label>
          <button class="btn-primary" id="b1" type="submit">인증 코드 받기</button>
        </form>
        <p id="m1" class="msg" role="alert"></p>
        <p class="note"><a href="index.html">로그인 화면으로</a></p>
      </div>

      <div id="s2" class="hidden">
        <h2>새 비밀번호 설정</h2>
        <p class="sub">가입된 이메일이라면 코드를 보냈어요.<br>코드와 새 비밀번호를 입력해 주세요.</p>
        <form id="f2">
          <label class="field"><span>인증 코드</span><input class="input otp" id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="000000" required></label>
          <label class="field"><span>새 비밀번호</span><input class="input" id="pw1" type="password" placeholder="8자 이상" autocomplete="new-password" minlength="8" required></label>
          <label class="field"><span>새 비밀번호 확인</span><input class="input" id="pw2" type="password" placeholder="한 번 더 입력" autocomplete="new-password" minlength="8" required></label>
          <button class="btn-primary" id="b2" type="submit">비밀번호 변경</button>
        </form>
        <p id="m2" class="msg" role="alert"></p>
        <button class="link-btn" id="resend" type="button">코드 다시 받기</button>
        <p class="note">메일이 안 보이면 스팸함도 확인해 주세요.</p>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const sb = GH.sb();
  let email = "";

  function cooldown(sec) {
    const b = $("resend"); b.disabled = true;
    const t = setInterval(() => {
      if (--sec <= 0) { clearInterval(t); b.disabled = false; b.textContent = "코드 다시 받기"; }
      else b.textContent = "코드 다시 받기 (" + sec + "초)";
    }, 1000);
  }
  async function sendCode() {
    if (GH.DEMO) return null;
    const { error } = await sb.auth.resetPasswordForEmail(email);
    return error;
  }

  $("f1").addEventListener("submit", async (e) => {
    e.preventDefault();
    const m = $("m1"), b = $("b1"); m.textContent = ""; m.className = "msg";
    email = $("email").value.trim(); b.disabled = true; b.textContent = "보내는 중...";
    const error = await sendCode();
    b.disabled = false; b.textContent = "인증 코드 받기";
    if (error && (error.status === 429 || /rate|seconds/i.test(error.message || ""))) { m.textContent = "요청이 너무 많아요. 잠시 뒤 다시 시도해 주세요."; return; }
    $("s1").classList.add("hidden"); $("s2").classList.remove("hidden"); cooldown(60);   // 가입 여부는 알려주지 않아요
  });

  $("f2").addEventListener("submit", async (e) => {
    e.preventDefault();
    const m = $("m2"), b = $("b2"); m.textContent = ""; m.className = "msg";
    const p1 = $("pw1").value, p2 = $("pw2").value;
    if (p1.length < 8) { m.textContent = "비밀번호는 8자 이상이어야 해요."; return; }
    if (p1 !== p2) { m.textContent = "두 비밀번호가 서로 달라요."; return; }
    if (GH.DEMO) { m.className = "msg ok"; m.textContent = "미리보기 모드라서 실제로 바뀌지는 않아요."; return; }
    b.disabled = true;
    const v = await sb.auth.verifyOtp({ email, token: $("otp").value.trim(), type: "recovery" });
    if (v.error) { b.disabled = false; m.textContent = "코드가 맞지 않거나 만료되었어요."; return; }
    const u = await sb.auth.updateUser({ password: p1 });
    b.disabled = false;
    if (u.error) { m.textContent = "변경하지 못했어요: " + u.error.message; return; }
    m.className = "msg ok"; m.textContent = "비밀번호를 바꿨어요. 곧 이동합니다.";
    setTimeout(() => location.replace("main.html"), 1200);
  });

  $("resend").addEventListener("click", async () => {
    const m = $("m2"); m.className = "msg";
    const error = await sendCode();
    if (error) { m.textContent = "잠시 뒤 다시 시도해 주세요."; return; }
    m.className = "msg ok"; m.textContent = "코드를 다시 보냈어요."; cooldown(60);
  });
</script>
</body>
</html>
