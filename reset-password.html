<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>E1 · 비밀번호 찾기</title>
<link rel="icon" href="logo.png">
<style>
  :root { --bg:#000; --violet:#7c5cff; --violet-soft:#a78bfa; --text:#e9e6f5; --muted:#8a85a3; --line:#2a2540; --panel:#0b0912; --danger:#ff6b81; --ok:#7ee2a8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; display:flex; align-items:center; justify-content:center; padding:env(safe-area-inset-top,0) 20px env(safe-area-inset-bottom,0); }
  main { width:100%; max-width:340px; text-align:center; }
  .logo { width:130px; height:130px; filter:drop-shadow(0 0 24px rgba(124,92,255,.45)); }
  h1 { margin:14px 0 8px; font-size:20px; }
  .sub { margin:0 0 24px; font-size:14px; color:var(--muted); line-height:1.6; }
  form { display:grid; gap:12px; }
  input { width:100%; padding:15px 16px; font-size:16px; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:10px; outline:none; }
  input::placeholder { color:var(--muted); }
  input:focus { border-color:var(--violet); box-shadow:0 0 0 3px rgba(124,92,255,.25); }
  .otp { text-align:center; font-size:26px; letter-spacing:8px; }
  .primary { padding:15px; font-size:16px; font-weight:600; color:#fff; background:var(--violet); border:0; border-radius:10px; cursor:pointer; }
  .primary:hover { background:#6a49f0; } .primary:disabled { opacity:.6; cursor:default; }
  .link { background:none; border:0; color:var(--violet-soft); font-size:14px; cursor:pointer; margin-top:14px; }
  .link:disabled { color:var(--muted); cursor:default; }
  .msg { min-height:20px; margin:14px 0 0; font-size:14px; color:var(--danger); line-height:1.5; }
  .msg.ok { color:var(--ok); }
  .note { margin-top:22px; font-size:13px; color:var(--muted); }
  .note a { color:var(--violet-soft); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="E1">

  <section id="s1">
    <h1>비밀번호 찾기</h1>
    <p class="sub">가입한 이메일로 인증 코드를 보내 드려요.</p>
    <form id="f1">
      <input id="email" type="email" placeholder="이메일" autocomplete="username" required>
      <button class="primary" id="b1" type="submit">인증 코드 받기</button>
    </form>
    <p id="m1" class="msg" role="alert"></p>
    <p class="note"><a href="index.html">로그인 화면으로</a></p>
  </section>

  <section id="s2" class="hidden">
    <h1>새 비밀번호 설정</h1>
    <p class="sub">가입된 이메일이라면 코드를 보냈어요.<br>코드와 새 비밀번호를 입력해 주세요.</p>
    <form id="f2">
      <input id="otp" class="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="000000" required>
      <input id="pw1" type="password" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" minlength="8" required>
      <input id="pw2" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password" minlength="8" required>
      <button class="primary" id="b2" type="submit">비밀번호 변경</button>
    </form>
    <p id="m2" class="msg" role="alert"></p>
    <button class="link" id="resend">코드 다시 받기</button>
    <p class="note">메일이 안 보이면 스팸함도 확인해 주세요.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  let email = "";

  function cooldown(sec) {
    const b = $("resend"); b.disabled = true;
    const t = setInterval(() => {
      if (--sec <= 0) { clearInterval(t); b.disabled = false; b.textContent = "코드 다시 받기"; }
      else b.textContent = "코드 다시 받기 (" + sec + "초)";
    }, 1000);
  }
  async function sendCode() {
    const { error } = await sb.auth.resetPasswordForEmail(email);
    return error;
  }

  $("f1").addEventListener("submit", async (e) => {
    e.preventDefault();
    const m = $("m1"), b = $("b1"); m.textContent = ""; m.className = "msg";
    email = $("email").value.trim(); b.disabled = true; b.textContent = "보내는 중...";
    const error = await sendCode();
    b.disabled = false; b.textContent = "인증 코드 받기";
    if (error && (error.status === 429 || /rate|seconds/i.test(error.message || ""))) { m.textContent = "요청이 너무 많아요. 잠시 뒤 다시 시도해 주세요."; return; }
    $("s1").classList.add("hidden"); $("s2").classList.remove("hidden"); cooldown(60);   // 가입 여부는 알려주지 않아요
  });

  $("f2").addEventListener("submit", async (e) => {
    e.preventDefault();
    const m = $("m2"), b = $("b2"); m.textContent = ""; m.className = "msg";
    const p1 = $("pw1").value, p2 = $("pw2").value;
    if (p1.length < 8) { m.textContent = "비밀번호는 8자 이상이어야 해요."; return; }
    if (p1 !== p2) { m.textContent = "두 비밀번호가 서로 달라요."; return; }
    b.disabled = true;
    const v = await sb.auth.verifyOtp({ email, token: $("otp").value.trim(), type: "recovery" });
    if (v.error) { b.disabled = false; m.textContent = "코드가 맞지 않거나 만료되었어요."; return; }
    const u = await sb.auth.updateUser({ password: p1 });
    b.disabled = false;
    if (u.error) { m.textContent = "변경하지 못했어요: " + u.error.message; return; }
    m.className = "msg ok"; m.textContent = "비밀번호를 바꿨어요. 곧 이동합니다.";
    setTimeout(() => location.replace("main.html"), 1200);
  });

  $("resend").addEventListener("click", async () => {
    const m = $("m2"); m.className = "msg";
    const error = await sendCode();
    if (error) { m.textContent = "잠시 뒤 다시 시도해 주세요."; return; }
    m.className = "msg ok"; m.textContent = "코드를 다시 보냈어요."; cooldown(60);
  });
</script>
</body>
</html>
