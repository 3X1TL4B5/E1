<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF0F6">
<title>비밀번호 설정</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body class="auth-body">
<button class="icon-btn theme-fab" type="button" data-theme-toggle aria-label="테마 바꾸기"></button>

<main class="auth">
  <section class="auth-brand">
    <img class="auth-logo" data-logo src="logo.svg" alt="">
    <div class="auth-copy">
      <p class="eyebrow">WELCOME</p>
      <h1 data-site-name>GAME HUB</h1>
      <p class="auth-lead">초대를 받아 입장했어요. 사용할 비밀번호를 정하면 바로 시작할 수 있어요.</p>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-card">
      <h2>비밀번호 설정</h2>
      <p class="sub">8자 이상으로 정해 주세요.</p>
      <form id="pw-form" class="hidden">
        <label class="field"><span>새 비밀번호</span><input class="input" id="pw1" type="password" placeholder="8자 이상" autocomplete="new-password" minlength="8" required></label>
        <label class="field"><span>비밀번호 확인</span><input class="input" id="pw2" type="password" placeholder="한 번 더 입력" autocomplete="new-password" minlength="8" required></label>
        <button class="btn-primary" id="submit" type="submit">비밀번호 저장</button>
      </form>
      <p id="msg" class="msg" role="alert">초대 정보를 확인하는 중...</p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const sb = GH.sb();
  const form = document.getElementById("pw-form");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submit");

  function showForm() { form.classList.remove("hidden"); msg.textContent = ""; }
  function showInvalid() { msg.textContent = "초대 링크가 만료되었거나 이미 사용되었어요. 관리자에게 다시 초대를 요청해 주세요."; }

  // 초대 링크로 들어오면 Supabase가 자동으로 세션을 만들어 줘요
  let ready = false;
  if (GH.DEMO) { ready = true; showForm(); }
  else {
    sb.auth.onAuthStateChange((event, session) => { if (session && !ready) { ready = true; showForm(); } });
    setTimeout(async () => {
      if (ready) return;
      const { data } = await sb.auth.getSession();
      if (data.session) { ready = true; showForm(); } else showInvalid();
    }, 1500);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = document.getElementById("pw1").value;
    const p2 = document.getElementById("pw2").value;
    msg.className = "msg";
    if (p1.length < 8) { msg.textContent = "비밀번호는 8자 이상이어야 해요."; return; }
    if (p1 !== p2) { msg.textContent = "두 비밀번호가 서로 달라요."; return; }
    if (GH.DEMO) { msg.className = "msg ok"; msg.textContent = "미리보기 모드라서 실제로 저장되지는 않아요."; return; }

    btn.disabled = true; btn.textContent = "저장 중...";
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) { msg.textContent = "저장하지 못했어요: " + error.message; btn.disabled = false; btn.textContent = "비밀번호 저장"; return; }
    msg.className = "msg ok"; msg.textContent = "비밀번호를 저장했어요. 곧 이동합니다.";
    setTimeout(() => location.replace("main.html"), 1200);
  });
</script>
</body>
</html>
