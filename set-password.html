<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>E1 · 비밀번호 설정</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg: #000;
    --violet: #7c5cff;
    --violet-soft: #a78bfa;
    --text: #e9e6f5;
    --muted: #8a85a3;
    --line: #2a2540;
    --danger: #ff6b81;
    --ok: #7ee2a8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top, 0) 20px env(safe-area-inset-bottom, 0);
  }
  main { width: 100%; max-width: 340px; text-align: center; }
  .logo {
    width: 140px; height: 140px; display: block; margin: 0 auto 24px;
    filter: drop-shadow(0 0 24px rgba(124, 92, 255, .45));
  }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
  .sub { margin: 0 0 28px; font-size: 14px; color: var(--muted); line-height: 1.6; }

  form { display: grid; gap: 12px; }
  input {
    width: 100%; padding: 15px 16px; font-size: 16px; color: var(--text);
    background: #0b0912; border: 1px solid var(--line); border-radius: 10px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(124,92,255,.25); }
  button {
    margin-top: 4px; padding: 15px; font-size: 16px; font-weight: 600; color: #fff;
    background: var(--violet); border: 0; border-radius: 10px; cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button:hover { background: #6a49f0; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--violet-soft); outline-offset: 3px; }
  #msg { min-height: 20px; margin: 16px 0 0; font-size: 14px; color: var(--danger); line-height: 1.5; }
  #msg.ok { color: var(--ok); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="E1">
  <h1>비밀번호 설정</h1>
  <p class="sub">초대를 받아 입장했어요.<br>사용할 비밀번호를 정해 주세요.</p>

  <form id="pw-form" class="hidden">
    <input id="pw1" type="password" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" minlength="8" required>
    <input id="pw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" minlength="8" required>
    <button id="submit" type="submit">비밀번호 저장</button>
  </form>
  <p id="msg" role="alert">초대 정보를 확인하는 중...</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // ▼ index.html과 같은 값을 넣어 주세요
  const SUPABASE_URL = "여기에_Project_URL";
  const SUPABASE_ANON_KEY = "여기에_anon_public_key";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const form = document.getElementById("pw-form");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submit");

  function showForm() {
    form.classList.remove("hidden");
    msg.textContent = "";
  }
  function showInvalid() {
    msg.textContent = "초대 링크가 만료되었거나 이미 사용되었어요. 관리자에게 다시 초대를 요청해 주세요.";
  }

  // 초대 링크로 들어오면 Supabase가 자동으로 세션을 만들어 줘요
  let ready = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (session && !ready) { ready = true; showForm(); }
  });
  setTimeout(async () => {
    if (ready) return;
    const { data } = await sb.auth.getSession();
    if (data.session) { ready = true; showForm(); } else { showInvalid(); }
  }, 1500);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = document.getElementById("pw1").value;
    const p2 = document.getElementById("pw2").value;
    msg.className = "";
    if (p1.length < 8) { msg.textContent = "비밀번호는 8자 이상이어야 해요."; return; }
    if (p1 !== p2) { msg.textContent = "두 비밀번호가 서로 달라요."; return; }

    btn.disabled = true;
    btn.textContent = "저장 중...";
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) {
      msg.textContent = "저장하지 못했어요: " + error.message;
      btn.disabled = false;
      btn.textContent = "비밀번호 저장";
      return;
    }
    msg.className = "ok";
    msg.textContent = "비밀번호를 저장했어요. 곧 이동합니다.";
    setTimeout(() => location.replace("main.html"), 1200);
  });
</script>
</body>
</html>
